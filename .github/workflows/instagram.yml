# Publishes Instagram posts scheduled in Ciel Admin (cielafrica.com/admin → Instagram), runs the daily auto-post,
# and checks Instagram for new messages, comments, likes, followers and tags on every run
# (they show in Ciel Admin's bell and as phone notifications).
# Messages, comments and mentions also arrive instantly once webhooks are on (Instagram → ⋯ → Instant notifications).
# GitHub may start a scheduled run a few minutes late.
name: instagram-scheduler
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish due posts and check for new activity
        run: curl -sS --max-time 90 "https://cielafrica.com/api/hq?route=ig-cron" || true
