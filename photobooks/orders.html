<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>Photo Book orders — Ciel Africa</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=20261108">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css?v=20261026a">
<link rel="stylesheet" href="/assets/pbk/pbk.css?v=20261108e">
<style>
body{background:#f6f2ea;font-family:Inter,system-ui,sans-serif;color:#1b1714}
.ao{max-width:1240px;margin:0 auto;padding:1.2rem}
.ao__top{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.ao__top img{height:30px}
.ao__top h1{font:800 1.5rem "PBK Spartan",Inter,sans-serif;flex:1}
.ao button,.ao .btn{border-radius:999px}
.ao__card{background:#fff;border:1px solid #e9e1d4;border-radius:18px;padding:1.2rem}
.ao__login{max-width:380px;margin:12vh auto}
.ao__login input,.ao__bar input,.ao__bar select,.ao select,.ao textarea{border:1px solid #e0d7c8;border-radius:12px;padding:.65rem .8rem;font:500 .95rem Inter,sans-serif;width:100%;background:#fff}
.ao__login .btn{width:100%;justify-content:center;margin-top:.8rem}
.ao__bar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.ao__bar input{flex:1;min-width:200px}.ao__bar select{width:auto}
.ao__list{display:grid;gap:.5rem}
.ao__row{display:grid;grid-template-columns:120px 1fr 1fr 110px 130px;gap:1rem;align-items:center;background:#fff;border:1px solid #e9e1d4;border-radius:14px;padding:.8rem 1rem;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ao__row:hover{border-color:#ff5a1f}
.ao__row small{display:block;color:#8a8076;font-size:.8rem}
.ao__b{display:inline-block;border-radius:999px;padding:.2rem .6rem;font-size:.76rem;font-weight:700;background:#efe8dc}
.ao__b--paid,.ao__b--ready{background:#e3f5ea;color:#16794a}.ao__b--printing,.ao__b--preparing{background:#e8f0ff;color:#1f4fb5}.ao__b--awaiting_payment{background:#fff3e0;color:#8a5a00}.ao__b--payment_failed,.ao__b--cancelled{background:#fde8e8;color:#9b1c1c}.ao__b--dispatched,.ao__b--delivered,.ao__b--ready_collection{background:#ede7ff;color:#5b3fd1}
.ao__det{display:grid;grid-template-columns:340px 1fr;gap:1.2rem;align-items:start}
.ao__det dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.92rem}
.ao__det dt{color:#8a8076}
.ao__book{display:flex;gap:1rem;align-items:flex-start;border:1px solid #efe8dc;border-radius:14px;padding:.9rem;margin-bottom:.8rem}
.ao__book img{width:96px;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.ao__book>div{flex:1;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.ao__acts{display:flex;flex-wrap:wrap;gap:.4rem}
.ao__pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:.4rem;width:100%}
.ao__pages button{border:1px solid #efe8dc;border-radius:6px;padding:0;background:#fff;cursor:pointer;overflow:hidden;font-size:.7rem;color:#8a8076}
.ao__pages img{width:100%;display:block}
.ao__hist{font-size:.84rem;color:#5c554e;list-style:none;display:grid;gap:.3rem;margin-top:.5rem}
.ao__msg{color:#8a8076;font-size:.88rem}
.ao__prc summary{cursor:pointer;font-size:.88rem;font-weight:600;margin:.4rem 0}.ao__prf{display:grid;gap:.4rem;margin:.4rem 0 .8rem}.ao__prf input{padding:.5rem .6rem;border:1px solid #e0d6c7;border-radius:8px;font:inherit}.ao__prs{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.5rem 0}#pr textarea{width:100%;margin:.4rem 0;padding:.6rem;border:1px solid #e0d6c7;border-radius:10px;font:inherit}.ao__pre{white-space:pre-wrap;font:inherit;font-size:.84rem;background:#fff;border-radius:8px;padding:.6rem .7rem;margin:.3rem 0;overflow-wrap:anywhere}
.ao__b--fix{background:#e8f1ff;color:#1e4fae}.ao__lnk{background:none;border:0;padding:0;color:#d9480f;text-decoration:underline;cursor:pointer;font:inherit}.ao__fxl{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}.ao__fxl input{flex:1 1 220px;min-width:0;padding:.45rem .6rem;border:1px solid #e0d6c7;border-radius:8px;font:inherit;font-size:.8rem}.ao__chk{display:inline-flex;gap:.35rem;align-items:center;font-size:.86rem}#fx textarea{width:100%;margin:.5rem 0;padding:.6rem;border:1px solid #e0d6c7;border-radius:10px;font:inherit}
.ao h2{font:800 1.2rem "PBK Spartan",Inter,sans-serif;margin:0 0 .7rem}
.ao__tip{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem;background:#fff6ef;border-color:#ffd2bd}.ao__tip a{color:#ff5a1f;text-decoration:underline}.ao__test{font-style:normal;background:#1b1714;color:#fff;border-radius:6px;padding:.1rem .4rem;font-size:.7rem;font-weight:800;letter-spacing:.05em;vertical-align:middle}.ao__row.is-test{background:#fffaf2;border-style:dashed}
.ao__back{background:none;border:0;color:#5c554e;font-weight:600;cursor:pointer;margin-bottom:.8rem}
@media(max-width:860px){.ao__row{grid-template-columns:1fr 1fr}.ao__det{grid-template-columns:1fr}}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("is-embed")</script>
<style>.is-embed .ao__top,.is-embed .ao__tip{display:none!important}</style>
<style>
/* phones (and the Ciel Admin app, which shows this page in a frame): nothing may be wider than the screen,
   or iOS widens the whole frame and the book preview is cut off on the right */
html,body{max-width:100%;overflow-x:hidden}
.ao,.ao *{min-width:0}
.ao__det dd,.ao__row span,.ao__msg{overflow-wrap:anywhere}
.ao__book img{flex:none;height:auto;align-self:flex-start}
.ao__pay{border:1px solid #e9e1d4;border-radius:14px;padding:.8rem .9rem;margin:.2rem 0 1rem;display:grid;gap:.35rem;background:#faf6ef;font-size:.9rem}
.ao__pay.is-wait{background:#fff6ef;border-color:#ffb48f}
.ao__pay blockquote{margin:.2rem 0;padding:.55rem .7rem;background:#fff;border-left:3px solid #ff5a1f;border-radius:6px;font-size:.84rem;white-space:pre-wrap;overflow-wrap:anywhere}
.ao__b--awaiting_confirmation{background:#fff3e0;color:#8a5a00}
@media(max-width:560px){.ao{padding:.8rem}.ao__book{flex-direction:column}.ao__book img{width:120px}.ao__acts .btn{flex:1 1 auto;justify-content:center}}
</style>
</head>
<body>
<div class="ao" id="ao"><p class="ao__msg">Loading…</p></div>

</body>
</html>
