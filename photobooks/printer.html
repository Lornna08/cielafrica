<style>
body{background:#f6f2ea;font-family:Inter,system-ui,sans-serif;color:#1b1714;margin:0}
.pj{max-width:760px;margin:0 auto;padding:1.2rem 1rem 3rem}
.pj__top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}.pj__top img{height:28px}.pj__top span{font-weight:700;color:#8a7c6c;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.pj__card{background:#fff;border:1px solid #e9e1d4;border-radius:18px;padding:1.2rem 1.3rem;margin-bottom:1rem}
.pj h1{font-size:1.5rem;margin:0 0 .2rem}.pj h2{font-size:1.05rem;margin:0 0 .6rem}
.pj dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.45rem 1rem;margin:0;font-size:.93rem}.pj dt{color:#8a7c6c}.pj dd{margin:0;overflow-wrap:anywhere}
.pj__b{border:1px solid #efe7dc;border-radius:14px;padding:1rem;margin-top:.8rem}.pj__b b{display:block;font-size:1rem}.pj__b ul{margin:.5rem 0 .8rem;padding-left:1.1rem;font-size:.88rem;line-height:1.6;color:#4d4640}
.pj__acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pj .btn{border-radius:999px}
.pj__msg{font-size:.85rem;color:#8a7c6c;margin:.5rem 0 0}.pj__err{background:#fff4f0;border-color:#ffd3c2}
.pj__warn{background:#fffbea;border:1px solid #f3e1a0;border-radius:12px;padding:.7rem .9rem;font-size:.88rem;margin-bottom:1rem}
.pj__test{display:inline-block;white-space:nowrap;background:#1b1714;color:#fff;font-size:.7rem;font-weight:700;padding:.15rem .45rem;border-radius:6px;vertical-align:middle}
.pj textarea{width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #e0d6c7;border-radius:10px;font:inherit;margin:.4rem 0}
.pj__ok{color:#1d7a46;font-weight:600}
</style>
